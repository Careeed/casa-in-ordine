name: Build APK debug

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Test (sintassi frontend + logica backend)
        run: npm test

      - name: Compila il frontend
        run: npm run build

      - name: Genera il progetto Android (se assente)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pubblica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: casa-in-ordine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
